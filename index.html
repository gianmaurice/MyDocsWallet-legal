<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDocs Wallet</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    color: #1d1d1f;
    background: #fbfbfd;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 24px;
    text-align: center;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  p.tagline {
    margin: 0 0 32px;
    color: #6e6e73;
    font-size: 1.05rem;
  }
  a.button {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 980px;
    background: #1d1d1f;
    color: #ffffff;
    text-decoration: none;
    font-weight: 500;
  }
  a.button:hover { opacity: 0.85; }
  footer {
    margin-top: 44px;
    font-size: 0.85rem;
    color: #86868b;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f5f5f7; background: #000000; }
    p.tagline { color: #a1a1a6; }
    a.button { background: #f5f5f7; color: #000000; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>MyDocs Wallet</h1>
    <p class="tagline">Your documents, organized and kept on your device.</p>
    <a class="button" href="privacypolicy.html">Privacy Policy</a>
    <footer>&copy; 2026 MyDocs Wallet</footer>
  </main>
</body>
</html>
